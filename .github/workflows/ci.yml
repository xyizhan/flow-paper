name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run audit
      - run: npm run package:mac
      - name: Test packaged app
        run: npm run test:e2e
        env:
          FLOW_PAPER_EXECUTABLE: ${{ github.workspace }}/release/Flow Paper-darwin-arm64/Flow Paper.app/Contents/MacOS/Flow Paper
