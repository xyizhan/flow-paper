name: Publish macOS preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.2.0-beta.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Validate tag and unused release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if(process.env.RELEASE_TAG !== 'v'+JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite.'; exit 1; fi
      - run: npm ci
      - run: npm run verify
      - run: npm run audit
      - run: npm run package:mac
      - name: Test packaged app
        run: npm run test:e2e
        env:
          FLOW_PAPER_EXECUTABLE: ${{ github.workspace }}/release/Flow Paper-darwin-arm64/Flow Paper.app/Contents/MacOS/Flow Paper
      - run: npm run release:mac
      - run: npm run source:archive
      - name: Publish verified preview
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Flow Paper $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md release/*.dmg release/*.zip release/SHA256SUMS.txt
